name: Automated AI & ML News Update

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and Aggregate AI & ML News
        run: |
          python scripts/fetch_news.py

      - name: Fetch and Aggregate Global Crypto & AI Events
        run: |
          python scripts/fetch_events.py

      - name: Commit and Push Updated Data Feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json public/events.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No news or events changes detected."
          else
            # [skip ci] prevents unnecessary CI and deployment build consumption
            git commit -m "chore(data): automated AI news and global events update [skip ci]"
            git push
          fi
